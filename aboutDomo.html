    <script>
    // common.js를 타임스탬프와 함께 동적으로 로드
    const timestamp = new Date().getTime();
    const script = document.createElement('script');
    script.src = `/js/common.js?t=${timestamp}`;

    // common.js 로드 완료 후 초기화
    script.onload = function() {
        // DOM 로드 후 페이지 컴포넌트 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            // DOM이 이미 로드된 경우 즉시 실행
            initializePage();
        }
    };

    document.head.appendChild(script);

    function initializePage() {
        // 사이드바 로드
        if (typeof loadSidebar === 'function') {
            loadSidebar('default-sidebar');
        }

        // 푸터 로드
        if (typeof loadFooter === 'function') {
            loadFooter('main-footer');
        }

        // ESC 키로 사이드바 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSidebar();
            }
        });

        // joinBtn 클릭 이벤트
        const joinBtn = document.getElementById('joinBtn');
        if (joinBtn) {
            joinBtn.addEventListener('click', function(e){
                domo.showAlert('comming soon.<br>문의사항은 DM 부탁드립니다.')
            });
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');

        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');

        // 사이드바 열릴 때 body 스크롤 방지
        document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    }

    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');

        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

        // 🎯 이미지 모달 열기 함수
    function openModal(imageSrc) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');

        // 📷 클릭한 이미지의 경로를 모달 이미지에 설정
        modalImg.src = imageSrc;

        // ✨ 모달 표시
        modal.classList.add('active');

        // 🚫 배경 스크롤 방지
        document.body.style.overflow = 'hidden';
    }

    // ❌ 이미지 모달 닫기 함수
    function closeModal(event) {
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');

        // 📌 X 버튼 클릭 또는 배경(오버레이) 클릭 시에만 닫기
        // 이미지 자체를 클릭한 경우에는 닫히지 않도록 처리
        if (event.target === modalImage) {
            return;
        }

        // ✨ 모달 숨김
        modal.classList.remove('active');

        // ✅ 배경 스크롤 복원
        document.body.style.overflow = '';
    }

    // ⌨️ ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('imageModal');
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
    });
</script>
