<!DOCTYPE html>
<html lang="ko">
<head>

    <script>

        const t = new Date().getTime();
        document.write(`<link rel="stylesheet" href="/css/common.css?t=${t}">`);
        document.write(`<link rel="stylesheet" href="/css/aboutDomo.css?t=${t}">`);
    </script>
</head>
<body>
    <!-- 사이드바 토글 -->

        </br>
        domo 에서는 3가지 역할을 선택할 수 있습니다.

    <div class="btnGr">
        <div class="btnRec1">
            <div class="btnTxt">dish.</div>
            <div class="btn" onclick="openModal('/image/dish.png')">click.</div>
        </div>
        <div class="btnRec2">
            <div class="btnTxt">drink.</div>
            <div class="btn" onclick="openModal('/image/drink.png')">click.</div>
        </div>
        <div class="btnRec3">
            <div class="btnTxt">present.</div>
            <div class="btn" onclick="openModal('/image/present.png')">click.</div>
        </div>
    </div>

    <div class="descTxt"></div>
    <div class="joinBtn" id="joinBtn">
      domo 2025
    </div>

    <!-- 🖼️ 이미지 확대 모달 -->
    <div class="modal-overlay" id="imageModal" onclick="closeModal(event)">
        <div class="modal-content">
            <!-- ❌ 닫기 버튼 -->
<!--            <button class="modal-close" onclick="closeModal(event)">×</button>-->
            <!-- 📷 확대된 이미지 -->
            <img class="modal-image" id="modalImage" src="" alt="확대 이미지">
        </div>
    </div>

    <!-- ⏰ 카운트다운 모달 (기존) -->
    <div class="modal-overlay" id="countdownModal" onclick="closeCountdownModal(event)">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 10px; max-width: 400px;">
            <div id="countdownModalText" style="text-align: center; font-size: 16px; line-height: 1.8;"></div>
            <button onclick="closeCountdownModal(event)" style="margin-top: 20px; width: 100%; padding: 10px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px;">확인</button>
        </div>
    </div>
    
    <!-- ✨ 새로 추가: "Coming Soon" 알림 모달 (카운트다운 모달과 동일한 디자인) -->
    <div class="modal-overlay" id="alertModal" onclick="closeAlertModal(event)">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 10px; max-width: 400px;">
            <div id="alertModalText" style="text-align: center; font-size: 16px; line-height: 1.8;"></div>
            <button onclick="closeAlertModal(event)" style="margin-top: 20px; width: 100%; padding: 10px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px;">확인</button>
        </div>
    </div>
    

    <!-- 사이드바 오버레이 -->
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="closeSidebar()" aria-label="메뉴 닫기">
            ×
        </button>
        <div id="sidebar-content">
            <!-- 사이드바 콘텐츠 -->
        </div>
    </div>

    <!-- 푸터 -->
    <div id="footer-container">
        <!-- 푸터 콘텐츠 -->
    </div>


    <script>
    // common.js를 타임스탬프와 함께 동적으로 로드
    const timestamp = new Date().getTime();
    const script = document.createElement('script');
    script.src = `/js/common.js?t=${timestamp}`;

    // common.js 로드 완료 후 초기화
    script.onload = function() {
        // DOM 로드 후 페이지 컴포넌트 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            // DOM이 이미 로드된 경우 즉시 실행
            initializePage();
        }
    };

    document.head.appendChild(script);

    function initializePage() {
        // 사이드바 로드
        if (typeof loadSidebar === 'function') {
            loadSidebar('default-sidebar');
        }

        // 푸터 로드
        if (typeof loadFooter === 'function') {
            loadFooter('main-footer');
        }

        // ESC 키로 사이드바 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSidebar();
            }
        });


        const joinBtn = document.getElementById('joinBtn');
        if (joinBtn) {
            joinBtn.addEventListener('click', function(e){
                // 오픈 시간 설정 (2025년 11월 15일 18시)
                const openTime = new Date('2025-11-15T18:00:00').getTime();
                const now = new Date().getTime();
                const distance = openTime - now;
                
                if (distance < 0) {
                    // 오픈 시간이 지남
                     window.location.href = '/aboutJoin.html';
                } else {
                      // ✨ 수정: 오픈 전 - domo.showAlert를 사용하여 카운트다운 표시
                    showCountdownWithDomoAlert(openTime);
                }
            });
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');

        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');

        // 사이드바 열릴 때 body 스크롤 방지
        document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    }

    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');

        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

        // 🎯 이미지 모달 열기 함수
    function openModal(imageSrc) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');

        // 📷 클릭한 이미지의 경로를 모달 이미지에 설정
        modalImg.src = imageSrc;

        // ✨ 모달 표시
        modal.classList.add('active');

        // 🚫 배경 스크롤 방지
        document.body.style.overflow = 'hidden';
    }

    // ❌ 이미지 모달 닫기 함수
    function closeModal(event) {
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');

        // 📌 X 버튼 클릭 또는 배경(오버레이) 클릭 시에만 닫기
        // 이미지 자체를 클릭한 경우에는 닫히지 않도록 처리
        if (event.target === modalImage) {
            return;
        }

        // ✨ 모달 숨김
        modal.classList.remove('active');

        // ✅ 배경 스크롤 복원
        document.body.style.overflow = '';
    }

    // ⌨️ ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('imageModal');
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
    });

// ✨ 새로 추가: domo.showAlert를 사용한 카운트다운 함수
let countdownInterval = null;

function showCountdownWithDomoAlert(openTime) {
    // 기존 인터벌이 있다면 정리
    if (countdownInterval) {
        clearInterval(countdownInterval);
    }
    
    // 카운트다운 업데이트 함수
    function updateCountdown() {
        const now = new Date().getTime();
        const distance = openTime - now;
        
        if (distance < 0) {
            // ✨ 수정: 시간이 지나면 인터벌 정리하고 모달창 닫기
            clearInterval(countdownInterval);
            countdownInterval = null;
            
            // 기존 알림 모달 닫기
            const alertModal = document.getElementById('customAlert');
            if (alertModal) {
                alertModal.classList.remove('show');
            }
            
            document.body.style.overflow = '';
            
            // ✨ 수정: "coming soon" 대신 페이지 이동
            setTimeout(() => {
                window.location.href = '/aboutJoin.html';
            }, 300);
            
            return;
        }
        
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        // domo.showAlert를 사용하여 카운트다운 표시
        domo.showAlert(`아직 신청 기간이 아닙니다.<br>${days}일 ${hours}시간 ${minutes}분 ${seconds}초 후에 신청 가능합니다.`);
    }
    
    // 즉시 실행 및 1초마다 업데이트
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);
    
    // ✨ 추가: 모달이 사용자에 의해 닫히면 인터벌도 정리
    const alertModal = document.getElementById('customAlert');
    if (alertModal) {
        // 기존 이벤트 리스너 제거를 위한 함수
        const handleModalClose = function(e) {
            // 모달이 닫힐 때 인터벌 정리
            if (!alertModal.classList.contains('show')) {
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                alertModal.removeEventListener('click', handleModalClose);
            }
        };
        
        // 모달 클릭 이벤트 감지
        alertModal.addEventListener('click', handleModalClose);
    }
}
    function closeCountdownModal(event) {
        const modal = document.getElementById('countdownModal');
        const modalContent = modal.querySelector('.modal-content');
        
        // 모달 컨텐츠 내부 클릭 시 닫히지 않도록
        if (event && modalContent.contains(event.target) && event.target.tagName !== 'BUTTON') {
            return;
        }
        
        // 인터벌 정리
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        
        // 모달 닫기
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    
</script>
</body>
</html>
