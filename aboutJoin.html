<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>domo.</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/aboutJoin.css">
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=stluekds1u&callback=initMap"></script>
</head>
<body>
    <!-- 사이드바 토글 -->
    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="메뉴 열기">
        =
    </button>
    
    <!-- End 콘텐츠 영역-->
    <div class="main-container">
        <div class="aboutDomoTxt">
            <div class="aboutTxt">About</div>
            <div class="domoTxt">domo.</div>
        </div>
        <div class="domo-info">
            <div class="info-sec">
                <p class="sec-t">party place</p>
                <p class="sec-c pretendard">서울 마포구 창전로 50-1 (지하1층 스튜디오하루)</p>
                <div id="map" style="width:100%;height:200px;"></div>
                <!-- <div style="height: 160px; width: 100%; background-color: blanchedalmond;">
                    지도
                </div> -->
            </div>
            <div class="info-sec">
                <p class="sec-t">party time</p>
                <p class="sec-c pretendard">12월 13일 오후 6:00</p>
            </div>
            <div class="info-sec">
                <p class="sec-t">price</p>
                <p class="sec-c pretendard">대여비 xx,xxx원<br>참가비 xx,xxx원<br>합계 : xxx,xxx원</p>
            </div>
            <div class="info-sec">
                <p class="sec-t">participant </p>
                <p class="sec-c pretendard">선착순 16명</p>
            </div>
            <button id="joinBtn" class="join-btn pretendard">신청하기</button>
        </div>
    </div>


    <!-- 콘텐츠 영역-->

    <!-- 사이드바 오버레이 -->
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="closeSidebar()" aria-label="메뉴 닫기">
            ×
        </button>
        <div id="sidebar-content">
            <!-- 사이드바 콘텐츠 -->
        </div>
    </div>

    <!-- 푸터 -->
    <div id="footer-container">
        <!-- 푸터 콘텐츠 -->
    </div>

    <!-- 공통 JS -->
    <script src="/js/common.js"></script>
    <script>
        // 페이지 전용 자바스크립트
        function handleAboutClick() {
            console.log('About domo clicked');
            window.location.href = "aboutDomo.html";
        }

        function handleJoinClick() {
            console.log('Join 2025 domo clicked');
            // TODO: Join 페이지 이동
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            
            // 사이드바 열릴 때 body 스크롤 방지
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // DOM 로드 후 페이지 컴포넌트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            // 사이드바 로드
            if (typeof loadSidebar === 'function') {
                loadSidebar('default-sidebar');
            }
            
            // 푸터 로드
            if (typeof loadFooter === 'function') {
                loadFooter('main-footer');
            }

            // ESC 키로 사이드바 닫기
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeSidebar();
                }
            });
        });


        document.getElementById('joinBtn').addEventListener('click', function(){
            

            toJoin();
        })

        function toJoin(){
            window.location.href = '/join.html';
        }


        //지도 생성
        function initMap() {
            // 경도(Longitude): 126.9326570
            // 위도(Latitude): 37.5468646
            var lat = 37.5468646;
            var lng = 126.9326570;

            // 지도 생성
            var map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(lat, lng),
                zoom: 16,
                gl: true,
                customStyleId : 'ba07d252-1ece-4b6f-8e5f-b97cce8c2376',
            });

            // 마커 추가
            var marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(lat, lng),
                map: map,
                title: '서울 마포구 창전로 50-1 (지하1층 스튜디오하루)'
            });

            // 정보창 추가
            var infoWindow = new naver.maps.InfoWindow({
                content: '<div style="padding:10px;font-size:12px; color: black;">서울 마포구 창전로 50-1 <br>(지하1층 스튜디오하루)<br>'
                            + '<a style="color: blue;" target="_blank" href="https://map.naver.com/p/entry/place/1826130562?c=17.50,0,0,0,dh&placePath=/home?from=map&fromPanelNum=1&additionalHeight=76&timestamp=202510132148&locale=ko&svcName=map_pcv5">링크'
                            + '</a>'
                        +'</div>'
            });

            //
            // 마커 클릭시 정보창 표시
            naver.maps.Event.addListener(marker, 'click', function() {
                if (infoWindow.getMap()) {
                    infoWindow.close();
                } else {
                    infoWindow.open(map, marker);
                }
            });
        }
    </script>
</body>
</html>
