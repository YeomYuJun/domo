<script>
    // 🎯 이미지 모달 열기 함수
 function openModal(imageSrc) {
     const modal = document.getElementById('imageModal');
     const modalImg = document.getElementById('modalImage');

     // 📷 클릭한 이미지의 경로를 모달 이미지에 설정
     modalImg.src = imageSrc;

     modal.classList.add('active');

     document.body.style.overflow = 'hidden';
 }

    function closeModal(event) {
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');

        // 이미지 자체를 클릭한 경우에는 닫히지 않도록 처리
        if (event.target === modalImage) {
            return;
        }

        modal.classList.remove('active');

        document.body.style.overflow = '';
    }

 document.addEventListener('keydown', function(e) {
     if (e.key === 'Escape') {
         const modal = document.getElementById('imageModal');
         if (modal.classList.contains('active')) {
             modal.classList.remove('active');
             document.body.style.overflow = '';
         }
     }
 });


 // 페이지 전용 자바스크립트
 function handleAboutClick() {
     console.log('About domo clicked');
     window.location.href = "aboutDomo.html";
 }

 function handleJoinClick() {
     console.log('Join 2025 domo clicked');
     window.location.href = "/aboutJoin.html";
 }

 function toggleSidebar() {
     const sidebar = document.getElementById('sidebar');
     const overlay = document.querySelector('.sidebar-overlay');

     sidebar.classList.toggle('active');
     overlay.classList.toggle('active');

     // 사이드바 열릴 때 body 스크롤 방지
     document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
 }

 function closeSidebar() {
     const sidebar = document.getElementById('sidebar');
     const overlay = document.querySelector('.sidebar-overlay');

     sidebar.classList.remove('active');
     overlay.classList.remove('active');
     document.body.style.overflow = '';
 }

 // DOM 로드 후 페이지 컴포넌트 초기화
 document.addEventListener('DOMContentLoaded', function() {
     // 사이드바 로드
     if (typeof loadSidebar === 'function') {
         loadSidebar('default-sidebar');
     }

     // 푸터 로드
     if (typeof loadFooter === 'function') {
         loadFooter('main-footer');
     }

     // ESC 키로 사이드바 닫기
     document.addEventListener('keydown', function(e) {
         if (e.key === 'Escape') {
             closeSidebar();
         }
     });
 });
</script>
